<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas Inteligentes - Búsqueda Semántica</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">

    <div class="search-header">
      <input type="text" id="busqueda" placeholder="🔍 Escribe para buscar un concepto..." oninput="manejarBusqueda()">
    </div>

    <div class="nav-tabs">
      <button onclick="cambiarVista('crear')" id="btnCrear" class="tab-btn activo">Crear Nota</button>
      <button onclick="cambiarVista('todas')" id="btnTodas" class="tab-btn">Ver Todas las Notas</button>
    </div>


    <div id="estado" class="badge">Iniciando aplicación...</div>

    <div id="vistaCrear" class="vista">
      <div class="card">
        <h3>Nueva Nota o Pendiente</h3>
        <textarea id="textoNota" placeholder="Escribe aquí tu nota..."></textarea>
        <button onclick="guardarNota()">Guardar Nota</button>
      </div>
    </div>

    <div id="vistaTodas" class="vista" style="display: none;">
      <h3>📚 Todas mis notas guardadas</h3>
      <div id="listaTodasNotas"></div>
    </div>

    <div id="vistaBusqueda" class="vista" style="display: none;">
      <h3 id="tituloBusqueda">Resultados de la búsqueda</h3>
      <div id="listaResultadosBusqueda"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
